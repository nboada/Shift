[package]
name = "tauri-plugin-web-auth"
version = "1.0.0"
description = "Leverage iOS' ASWebAuthenticationSession and Android's Custom Tabs to authenticate users in your Tauri app."
license = "MIT"
authors = [ "Manaf941" ]
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-web-auth"
# Vendored from https://github.com/Manaf941/tauri-plugin-web_auth 1.0.0 (MIT): its Swift entry point wasn't public,
# so release builds stripped it and the app failed to link. iOS only; the Android half is left out.
publish = false

[dependencies]
tauri = { version = "2.5.0" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.2.0", features = ["build"] }
