# Signs debug builds with a stable identity before running them. An unsigned binary is a new program to macOS after
# every rebuild, so the Keychain asks again for each account's refresh token; a signed one keeps "Always Allow".
# Uses SHIFT_SIGN_IDENTITY, else the Mac's Developer ID certificate; without either it just runs unsigned.
[target.'cfg(target_os = "macos")']
runner = ["sh", "-c", "codesign --force --sign \"${SHIFT_SIGN_IDENTITY:-Developer ID Application}\" \"$0\" >/dev/null 2>&1; exec \"$0\" \"$@\""]
