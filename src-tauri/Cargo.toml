[package]
name = "app"
version = "0.3.2"
description = "Shift, a Gmail client for macOS"
authors = ["Nicolas Boada"]
license = "MIT"
repository = "https://github.com/nboada/Shift"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
anyhow = "1.0.105"
futures = "0.3.34"
base64 = "0.23.1"
sha2 = "0.11.1"
getrandom = "0.4.3"
mail-builder = { version = "2.0.1", default-features = false }
mail-parser = "1.0.2"
mail-send = { version = "0.7.0", default-features = false, features = ["aws_lc_rs", "tls12"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7.1"
keyring = "4.2.0"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
auto-launch = "0.6"
encoding_rs = "0.8"
jiff = "1.0.2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# Not stripped: rustc's strip step can leave the string table 4-byte aligned, and dyld on macOS 27 refuses such a binary
# or proc macro ("mis-aligned LINKEDIT string pool"). The linker's own output is aligned; stripping saved about 2 MB.
strip = false

[lints.clippy]
perf = { level = "warn", priority = -1 }
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
unwrap_used = "warn"
