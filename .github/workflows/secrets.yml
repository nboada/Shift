# Fails any push or pull request that adds a secret, or a commit signed with a personal email address. The repository is
# public, so a leaked key or address is leaked for good.
name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1
  commit-identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: authors and committers use a noreply address
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch, or a force-push that dropped "before", has no range to check: check its newest commit only.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$AFTER"; else range="-1 $AFTER"; fi
          bad=$(git log --format='%h %ae %ce' $range | grep -vE '^[0-9a-f]+ ([^ ]+@users\.noreply\.github\.com|noreply@github\.com) ([^ ]+@users\.noreply\.github\.com|noreply@github\.com)$' || true)
          if [ -n "$bad" ]; then echo "Commits must use a GitHub noreply address (see CLAUDE.md):"; echo "$bad"; exit 1; fi
